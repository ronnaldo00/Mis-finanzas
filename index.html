<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <!-- Esta línea hace que la página se adapte bien al celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mis Lukas</title>
  <link rel="stylesheet" href="estilos.css">

  <!-- Estos datos permiten instalar la página como una app en el celular -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icono-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mis Lukas">
  <!-- Color de la barra superior del celular: uno para modo claro y otro para oscuro -->
  <meta name="theme-color" content="#fde047" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#211d12" media="(prefers-color-scheme: dark)">
</head>
<body>
  <!-- ANIMACIÓN DE ENTRADA: billetes cayendo en la billetera del logo.
       Los tiempos y movimientos están en estilos.css (sección ANIMACIÓN DE ENTRADA).
       El orden importa: lo que se escribe después queda encima, por eso los
       billetes van entre la parte de atrás y el frente de la billetera. -->
  <div id="intro">
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <!-- Un solo dibujo de billete que se reutiliza con <use> -->
        <g id="billete">
          <rect x="140" y="100" width="232" height="130" rx="8" fill="#d5e6cc"/>
          <rect x="148" y="108" width="216" height="114" rx="4" fill="none" stroke="#1f4d2e" stroke-width="3"/>
          <ellipse cx="256" cy="165" rx="36" ry="42" fill="#eef5e9" stroke="#1f4d2e" stroke-width="4"/>
          <text x="256" y="181" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#1f4d2e">L</text>
          <text x="172" y="136" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#1f4d2e">100</text>
          <text x="340" y="136" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#1f4d2e">100</text>
        </g>
      </defs>

      <g class="intro-escena">
      <!-- Parte de atrás de la billetera -->
      <g class="intro-billetera"><rect x="122" y="215" width="268" height="190" rx="44" fill="#991b1b"/></g>

      <!-- Los billetes del logo: arranca igual a la pantalla inicial del celular
           y ella se los traga para que parezca que el logo cobra vida -->
      <g class="intro-billete-logo" style="--giro-fin:-3deg;--fin-y:12px"><use href="#billete"/></g>
      <g class="intro-billete-logo" style="--giro-fin:-9deg;--fin-y:0px"><use href="#billete"/></g>

      <!-- Los dos últimos se quedan asomados, igual que en el logo -->
      <g id="intro-primer-final" class="intro-billete-final" style="--giro-fin:-3deg;--fin-y:12px;--retraso:1.55s"><use href="#billete"/></g>
      <g class="intro-billete-final" style="--giro-fin:-9deg;--fin-y:0px;--retraso:1.68s"><use href="#billete"/></g>

      <!-- Frente de la billetera con su cara -->
      <g class="intro-billetera">
        <rect x="122" y="245" width="268" height="162" rx="44" fill="#ef4444"/>
        <g class="intro-mejillas">
          <circle cx="182" cy="338" r="14" fill="#f9a1a1"/>
          <circle cx="330" cy="338" r="14" fill="#f9a1a1"/>
        </g>
        <g class="intro-ojos">
          <ellipse cx="213" cy="302" rx="12" ry="16" fill="#1f2937"/>
          <ellipse cx="299" cy="302" rx="12" ry="16" fill="#1f2937"/>
          <circle cx="218" cy="295" r="4" fill="#ffffff"/>
          <circle cx="304" cy="295" r="4" fill="#ffffff"/>
        </g>
        <!-- Boquita de asombro, que luego se cambia por la sonrisa -->
        <ellipse class="intro-boca-o" cx="256" cy="350" rx="10" ry="12" fill="#1f2937"/>
        <g class="intro-sonrisa">
          <path d="M222 342H290Q284 366 256 366Q228 366 222 342Z" fill="#1f2937"/>
          <path d="M240 359Q256 368 272 359" fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/>
        </g>
      </g>
      </g>
    </svg>
    <p class="intro-nombre" aria-hidden="true">Mis Lukas</p>
    <!-- Botón para apagar o prender el sonido. El dibujo cambia con la clase "apagado" -->
    <button id="intro-sonido" type="button" aria-label="Apagar sonido">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/>
        <g class="intro-sonido-ondas" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/>
          <path d="M18 7a7 7 0 0 1 0 10"/>
        </g>
        <path class="intro-sonido-x" d="M16 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <script>
    // Lluvia de billetes: cada vez que se abre la app caen en posiciones distintas.
    // Va aquí, junto al dibujo, para que los billetes existan desde el primer instante.
    const CANTIDAD_BILLETES = 30;
    const primerFinal = document.getElementById('intro-primer-final');
    for (let i = 0; i < CANTIDAD_BILLETES; i++) {
      const x = Math.round(Math.random() * 440 - 220);     // desde dónde cae
      const giro = Math.round(Math.random() * 120 - 60);   // qué tan torcido viene
      const retraso = (0.4 + i * 0.03).toFixed(2);       // uno detrás de otro
      primerFinal.insertAdjacentHTML('beforebegin',
        `<g class="intro-billete" style="--x:${x}px;--giro:${giro}deg;--retraso:${retraso}s"><use href="#billete"/></g>`);
    }

    // SONIDO DE CONTADORA DE BILLETES. No usa archivo de audio: se fabrica con código.
    let audioIntro = null;

    // Volumen general de la intro: 1 con sonido y 0 en silencio
    let volumenIntro = null;

    // La elección del usuario se recuerda aparte de sus datos financieros.
    // Va con try porque en algunos modos el navegador no deja guardar.
    const CLAVE_SONIDO = 'mis-lukas-sonido';
    function leerSonidoApagado() {
      try { return localStorage.getItem(CLAVE_SONIDO) === 'apagado'; } catch { return false; }
    }
    function guardarSonidoApagado(apagado) {
      try {
        if (apagado) localStorage.setItem(CLAVE_SONIDO, 'apagado');
        else localStorage.removeItem(CLAVE_SONIDO);
      } catch { /* si no se puede guardar, solo vale para esta vez */ }
    }
    let sonidoIntroApagado = leerSonidoApagado();

    // Programa los "frrrrt": muchos golpecitos de ruido, muy cortos y seguidos,
    // uno por cada billete que pasa por la máquina, y el zumbido suave del motor.
    // "duracion" son los segundos que suena la contadora, antes del tin.
    // "salida" es por dónde sale el sonido; así el botón puede silenciarlo.
    function programarContadora(ctx, inicio, duracion = 1.6, salida = ctx.destination) {
      const BILLETES_POR_SEG = 28;  // qué tan rápido cuenta
      const VOLUMEN = 0.8;

      const general = ctx.createGain();
      general.gain.value = VOLUMEN;
      general.connect(salida);

      // Un segundo de ruido blanco: de ahí sale el sonido del papel
      const ruido = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const muestras = ruido.getChannelData(0);
      for (let i = 0; i < muestras.length; i++) muestras[i] = Math.random() * 2 - 1;

      // Este filtro deja solo los tonos agudos, los que suenan a papel
      const filtro = ctx.createBiquadFilter();
      filtro.type = 'bandpass';
      filtro.frequency.value = 3200;
      filtro.Q.value = 0.9;
      filtro.connect(general);

      const total = Math.floor(duracion * BILLETES_POR_SEG);
      for (let i = 0; i < total; i++) {
        // Una pequeña variación en cada golpe para que no suene a robot
        const t = inicio + i / BILLETES_POR_SEG + Math.random() * 0.006;
        const fuerza = 0.7 + Math.random() * 0.3;
        const golpe = ctx.createBufferSource();
        golpe.buffer = ruido;
        const volumenGolpe = ctx.createGain();
        volumenGolpe.gain.setValueAtTime(0.0001, t);
        volumenGolpe.gain.exponentialRampToValueAtTime(fuerza, t + 0.002);
        volumenGolpe.gain.exponentialRampToValueAtTime(0.0001, t + 0.024);
        golpe.connect(volumenGolpe).connect(filtro);
        golpe.start(t, Math.random() * 0.9, 0.03);
      }

      // El motor: un tono grave que sube al arrancar y baja al terminar
      const motor = ctx.createOscillator();
      motor.type = 'triangle';
      motor.frequency.value = 95;
      const volumenMotor = ctx.createGain();
      volumenMotor.gain.setValueAtTime(0.0001, inicio);
      volumenMotor.gain.linearRampToValueAtTime(0.14, inicio + 0.08);
      volumenMotor.gain.setValueAtTime(0.14, inicio + duracion - 0.08);
      volumenMotor.gain.linearRampToValueAtTime(0.0001, inicio + duracion);
      motor.connect(volumenMotor).connect(general);
      motor.start(inicio);
      motor.stop(inicio + duracion);

      // El "¡tin!" final: tres tonos agudos a la vez que se apagan poco a poco
      const momentoTin = inicio + duracion + 0.03;
      for (const [frecuencia, fuerza] of [[2093, 0.45], [3136, 0.25], [5274, 0.1]]) {
        const tono = ctx.createOscillator();
        tono.type = 'sine';
        tono.frequency.value = frecuencia;
        const volumenTono = ctx.createGain();
        volumenTono.gain.setValueAtTime(0.0001, momentoTin);
        volumenTono.gain.exponentialRampToValueAtTime(fuerza, momentoTin + 0.004);
        volumenTono.gain.exponentialRampToValueAtTime(0.0001, momentoTin + 1);
        tono.connect(volumenTono).connect(general);
        tono.start(momentoTin);
        tono.stop(momentoTin + 1.02);
      }
    }

    // Apaga el sonido cuando la animación termina o se salta
    function detenerSonidoIntro() {
      audioIntro?.close().catch(() => {});
      audioIntro = null;
    }

    function sonarIntro() {
      if (!window.AudioContext || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const comienzo = performance.now();
      const ENTRADA_BILLETES = 0.6; // segundos, cuando la billetera empieza a tragar

      audioIntro = new AudioContext();
      volumenIntro = audioIntro.createGain();
      volumenIntro.gain.value = sonidoIntroApagado ? 0 : 1;
      volumenIntro.connect(audioIntro.destination);
      // Si el navegador no permite sonido sin un toque previo, esto se queda
      // esperando y la animación sigue en silencio, sin ningún error.
      audioIntro.resume().then(() => {
        // Si la animación ya se quitó, no hay nada que sonar
        if (!audioIntro || !document.getElementById('intro')) return;
        const transcurrido = (performance.now() - comienzo) / 1000;

        // En algunos celulares el audio tarda en arrancar. Si llega tarde,
        // la contadora se acorta para que el tin siga cayendo con el salto.
        const retraso = Math.max(0, transcurrido - ENTRADA_BILLETES);
        const duracion = Math.max(0.5, 1.6 - retraso);
        programarContadora(audioIntro, audioIntro.currentTime + Math.max(0, ENTRADA_BILLETES - transcurrido), duracion, volumenIntro);
      }).catch(() => {});
    }
    sonarIntro();

    // Botón del parlante
    const botonSonido = document.getElementById('intro-sonido');
    function mostrarEstadoSonido() {
      botonSonido.classList.toggle('apagado', sonidoIntroApagado);
      botonSonido.setAttribute('aria-label', sonidoIntroApagado ? 'Encender sonido' : 'Apagar sonido');
    }
    mostrarEstadoSonido();
    botonSonido.addEventListener('click', (evento) => {
      // Sin esto, el toque también saltaría la animación
      evento.stopPropagation();
      sonidoIntroApagado = !sonidoIntroApagado;
      guardarSonidoApagado(sonidoIntroApagado);
      mostrarEstadoSonido();
      if (!volumenIntro) return;
      volumenIntro.gain.setTargetAtTime(sonidoIntroApagado ? 0 : 1, audioIntro.currentTime, 0.01);
      // Este toque le da permiso al navegador: si estaba bloqueado, aquí arranca
      if (!sonidoIntroApagado) audioIntro.resume().catch(() => {});
    });
  </script>

  <div class="app">
    <!-- MENÚ: a la izquierda en computador, abajo en celular.
         El atributo data-vista dice qué pantalla abre cada botón (lo lee app.js). -->
    <nav class="menu" aria-label="Secciones">
      <p class="marca">Mis Lukas</p>
      <button class="menu-item" data-vista="inicio">Inicio</button>
      <button class="menu-item" data-vista="movimientos">Movimientos</button>
      <button class="menu-item" data-vista="presupuestos">Presupuesto</button>
      <button class="menu-item" data-vista="deudas">Deudas</button>
      <button class="menu-item" data-vista="cuentas">Cuentas</button>
      <!-- Chat con Claude (asistente.js). En el celular se muestra solo la estrellita -->
      <button class="menu-item" data-vista="asistente" aria-label="Asistente">
        <span class="texto-largo">Asistente</span><span class="icono-corto" aria-hidden="true">✦</span>
      </button>
      <!-- En el celular no cabe la palabra, entonces se muestra solo el engranaje -->
      <button class="menu-item" data-vista="ajustes" aria-label="Ajustes">
        <span class="texto-largo">Ajustes</span><span class="icono-corto" aria-hidden="true">⚙&#xFE0E;</span>
      </button>
    </nav>

    <main class="principal">
      <!-- BARRA SUPERIOR: título de la pantalla, selector de mes y botón Agregar -->
      <header class="barra">
        <h1 id="titulo-vista"></h1>
        <div class="barra-acciones">
          <div class="selector-mes" id="selector-mes">
            <button class="boton-icono" data-accion="mes-anterior" aria-label="Mes anterior">‹</button>
            <span id="nombre-mes" aria-live="polite"></span>
            <button class="boton-icono" data-accion="mes-siguiente" aria-label="Mes siguiente">›</button>
          </div>
          <button class="boton boton-principal" data-accion="nuevo-movimiento">+ Agregar</button>
        </div>
      </header>

      <!-- Aquí aparece el aviso cuando se están viendo datos de ejemplo -->
      <div id="banner-ejemplo"></div>

      <!-- app.js dibuja aquí la pantalla que esté activa -->
      <div id="contenido"></div>
    </main>
  </div>

  <!-- Ventana emergente reutilizable para todos los formularios -->
  <dialog id="dialogo"></dialog>

  <!-- Cuadrito que aparece al pasar el mouse por una gráfica -->
  <div id="tooltip" hidden></div>

  <!-- Mensaje corto que confirma cada acción ("Movimiento guardado") -->
  <div id="aviso" role="status" aria-live="polite"></div>

  <!-- Selector de archivo oculto, se usa para restaurar un respaldo -->
  <input type="file" id="archivo-respaldo" accept=".json,application/json" hidden>

  <!-- El orden importa: cada archivo usa cosas definidas en los anteriores -->
  <script src="datos.js"></script>
  <script src="graficas.js"></script>
  <script src="app.js"></script>
  <script src="asistente.js"></script>
</body>
</html>
